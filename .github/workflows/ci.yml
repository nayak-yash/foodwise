name: Foodwise checks
on: [push, pull_request]
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RETRIEVAL_MODE: lexical
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the application
        run: docker compose up --build --wait --wait-timeout 180 backend intelligence frontend
      - name: Verify the full incident lifecycle and restart recovery
        run: python3 scripts/smoke_test.py --restart-agent
      - name: Capture service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop services
        if: always()
        run: docker compose down
