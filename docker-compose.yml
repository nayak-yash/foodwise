name: restaurantops
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: restaurantops
      POSTGRES_USER: restaurantops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurantops-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/seeds/001_demo.sql:/docker-entrypoint-initdb.d/002_demo.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U restaurantops -d restaurantops]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://restaurantops:${POSTGRES_PASSWORD:-restaurantops-local}@postgres:5432/restaurantops?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      MANAGER_API_TOKEN: ${MANAGER_API_TOKEN:-local-manager-change-me}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-local-agent-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
      GIN_MODE: release
      DEMO_MODE: 'true'
      VERIFY_WINDOW_SECONDS: '10'
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8080/readyz']
      interval: 5s
      timeout: 3s
      retries: 30

  intelligence:
    build: ./intelligence
    environment:
      DATABASE_URL: postgres://restaurantops:${POSTGRES_PASSWORD:-restaurantops-local}@postgres:5432/restaurantops?sslmode=disable
      BACKEND_URL: http://backend:8080
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-local-agent-change-me}
      KAFKA_BROKERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-fastembed}
      VERIFY_WINDOW_SECONDS: '10'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - embeddings_cache:/root/.cache/fastembed
    depends_on:
      backend: {condition: service_healthy}
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      INTELLIGENCE_URL: http://intelligence:8000
      MANAGER_API_TOKEN: ${MANAGER_API_TOKEN:-local-manager-change-me}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-local-agent-change-me}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-manager}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-restaurantops}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      backend: {condition: service_healthy}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes: ['./infra/otel-collector.yml:/etc/otelcol/config.yml:ro']

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro']

  tempo:
    image: grafana/tempo:2.7.2
    command: ['-config.file=/etc/tempo.yml']
    volumes: ['./infra/tempo.yml:/etc/tempo.yml:ro']

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${DASHBOARD_PASSWORD:-restaurantops}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports: ['127.0.0.1:3001:3000']
    volumes:
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./infra/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./infra/grafana/operations.json:/var/lib/grafana/dashboards/operations.json:ro

volumes:
  postgres_data:
  kafka_data:
  embeddings_cache:
